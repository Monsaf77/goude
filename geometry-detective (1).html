 pn(`<div style="text-align:center;color:#fff;font-size:44px">🦉</div><div class="lbl" style="color:#fde68a;font-weight:800;text-align:center;margin-bottom:4px">${U.name?'أهلاً '+esc(U.name)+'! ':''}اجمع 16 من 20 في كل نموذج لتفتح التالي</div>
 ${c?`<button class="big" onclick="resume()">▶ تابع من حيث توقفت — نموذج (${MODN[c.m]}) س${c.qs[c.k]+1}</button>`:''}
 ${[0,1,2].map(m=>{const u=unl(m),p=pass(m);return `<button class="stg ${u?'':'lock'}" ${u?`onclick="open_(${m})"`:''}><div class="ic">${u?['🏝️','🏔️','🏰'][m]:'🔒'}</div><div><b>النموذج (${MODN[m]})</b><small>${dn(m)?`${fmt(msc(m))} / 20 ${'⭐'.repeat(stars(msc(m)))}`:'لم يُلعب بعد'}</small></div><span class="go">${u?(p?'✅':'▶'):''}</span></button>`}).join('')}
 <div class="cl shim ${allp()?'open':''}" ${allp()?'onclick="cert()" style="cursor:pointer"':''}>${allp()?'🏆📜 شهادتك جاهزة! اضغط لفتحها':'🔒📜 الشهادة مقفلة — أكمل النماذج الثلاثة لتحصل عليها'}<br><b>${n} من 3</b></div>`)}
function open_(m){const miss=[0,1,2,3,4].filter(q=>bs_(m,q)<4);if(!dn(m)||!miss.length)return run(m,[0,1,2,3,4]);
 $('#ov').innerHTML=`<div class="ov"><div class="card center"><h2>النموذج (${MODN[m]})</h2><p>${fmt(msc(m))} / 20</p><button class="big" onclick="run(${m},[${miss}])">🎯 أعد الأسئلة الناقصة فقط</button><button class="big alt" onclick="run(${m},[0,1,2,3,4])">🔁 أعد النموذج كاملاً</button><button class="big alt" onclick="$('#ov').innerHTML=''">إغلاق</button></div></div>`}
function run(m,qs){$('#ov').innerHTML='';RUN={m,qs,k:0};question()}
function back(){cp();map()}
function upd(){const m=S.m,q=S.q;let s=0;for(let k=0;k<5;k++)s+=k==q?Math.max(bs_(m,k),Math.max(0,S.live-S.spent)):bs_(m,k);$('#sc').textContent=fmt(s);$('#sk').textContent=streak;$('#hc').textContent=S.hints;$('#hp').classList.toggle('z',S.hints==0);$('#lb').textContent=`نموذج (${MODN[m]}) • س${q+1}/5`}
function startUI(){hd(1);$('#fc').classList.remove('shine','mini');$('#fc').innerHTML=svgOf(S.d.F);upd()}
function narUI(){pn(`<div class="card"><div class="nar"><div class="av">🕵️</div><div class="bub" id="bub"></div></div><div class="dots" id="dts">${S.d.st.map(()=>'<i></i>').join('')}</div><button class="big" id="nb" onclick="beat()">التالي ◀</button></div>`)}
function question(){const q=RUN.qs[RUN.k],m=RUN.m,d=QD(m,q);S={m,q,d,hints:3,used:0,spent:0,live:0,cur:0,fails:0,sh:0,bi:-1,pts:{},pc:{},ph:'nar'};startUI();narUI();beat()}
function showB(){const d=S.d,[t,ids,il]=d.st[S.bi],b=$('#bub');b.innerHTML=t+(il?ILL:'');b.style.animation='none';void b.offsetWidth;b.style.animation='';
 document.querySelectorAll('#dts i').forEach((x,k)=>x.classList.toggle('d',k<=S.bi));glow(ids);if(S.bi==d.st.length-1)$('#nb').textContent=d.mc?'جاهز للإجابة ✍️':'ابنِ البرهان 🧩'}
function beat(){const d=S.d;if(S.bi==d.st.length-1)return d.mc?mcq():proof();S.bi++;showB();snd('pop');cp()}
function mcq(){S.ph='mcq';cp();const L4=['أ','ب','جـ','د'],mc=S.d.mc;pn(`<div class="card"><div class="q">ما قياس الزاوية الخضراء ${mm('m(∠AEC)')} ؟</div><div class="opts">${mc.opts.map((v,k)=>`<button class="opt" data-v="${v}" onclick="pickO(this)">${L4[k]}) ${v}°</button>`).join('')}</div><div id="rs"></div></div>`)}
function pickO(b){const ok=+b.dataset.v==S.d.mc.ans;document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.v==S.d.mc.ans)o.classList.add('ok')});
 if(ok){S.live+=4;streak++;snd('ok');boom(14);$('#rs').innerHTML='<div class="res g">🎉 ممتاز! إجابة صحيحة <b>+4</b><br>لكن… من أين جئت بها؟ <b>أرني الدليل!</b></div>'}
 else{b.classList.add('no');streak=0;snd('soft');$('#rs').innerHTML='<div class="res s">لا بأس — المحقق الحقيقي يتعلم من كل قضية 🌱<br>الإجابة الصحيحة هي <b>'+document.querySelector('.opt.ok').textContent+'</b>.<br>تعال نبني الدليل معاً ونفهم السبب.</div>'}
 upd();S.ph='proof';cp();$('#rs').insertAdjacentHTML('beforeend','<button class="big" onclick="proof()">ابنِ البرهان 🧩</button>')}
/* ===== بناء البرهان ===== */
const PEN=0.25;/* الخصم عن كل محاولة خاطئة، وأقصاه نقطة واحدة للخطوة */
const dirOf=t=>/[\u0600-\u06FF]/.test(t)?'rtl':'ltr';
const fxH=t=>`<span class="fx" dir="auto">${t}</span>`;
const rowH=(r,i)=>{const dn_=i<S.cur,pt=S.pts[i];return `<div class="row ${dn_?'done':i==S.cur?'cur':'lk'}" id="r${i}" style="direction:${r.d}">${dn_&&pt?`<span class="gt">+${fmt(pt)}</span>`:''}${r.c.map(c=>c.s==null?fxH(c.f):dn_?`<button class="slot ok" style="direction:${dirOf(c.s)}">${c.s}</button>`:`<button class="slot" onclick="slotTap(this)"></button>`).join('')}</div>`};
function proof(rs){S.ph='proof';pn(`<div class="card pf"><h3>🧩 ابنِ البرهان بنفسك</h3><div id="rows">${S.d.rows.map(rowH).join('')}</div><div class="pm" id="pm">ابدأ بالقطعة المضيئة ✨ ثم اضغط قطعة وبعدها الخانة الفارغة 👆</div><div class="pool" id="pool"></div><div class="tools"><button onclick="hintBtn()">💡 تلميح</button></div></div>`);$('#fc').classList.add('mini');
 if(rs)for(let i=0;i<S.cur;i++)glow(S.d.rows[i].g,1);
 fill(S.cur);begin();
 if(rs){const sl=[...$('#r'+S.cur).querySelectorAll('.slot')];(S.sl||[]).forEach((t,j)=>{if(!sl[j])return;const tl=t&&[...document.querySelectorAll('.tile:not(.used)')].find(x=>x.dataset.t==t);if(tl){tl.classList.add('used');sl[j].dataset.txt=t;sl[j].textContent=t;sl[j].style.direction=dirOf(t)}});if(sl.length&&sl.every(s=>s.dataset.txt))chk()}else cp()}
/* بداية كل خطوة: تضيء القطعة الصحيحة الأولى في الصندوق فقط كإشارة للبدء (الرسم لا يتغيّر) */
function begin(){const f0=exOf(S.d.rows[S.cur])[0],t=[...document.querySelectorAll('.tile')].find(x=>x.dataset.t==f0);if(t)t.classList.add('hint')}
const exOf=r=>r.c.filter(c=>c.s!=null).map(c=>c.s);
function fill(i){const r=S.d.rows[i];$('#pool').innerHTML=shuf(exOf(r)).map(t=>`<button class="tile" data-t="${t}" style="direction:${dirOf(t)}" onclick="tileTap(this)">${t}</button>`).join('');sel=selSlot=null}
const tileOf=t=>[...document.querySelectorAll('.tile.used')].find(x=>x.dataset.t==t);
/* ربط القطعة بالرسم حسب المعنى (لا حسب الصحة): اسم معروف في الرسم، أو قياس مكتوب عليه، أو x */
const lay=t=>{const d=S.d,s=new Set(d.tm[t]||[]);(t.match(/\d+(?=°)/g)||[]).forEach(n=>(d.lab[n]||[]).forEach(v=>s.add(v)));if(/(^|[^A-Za-z])x([^A-Za-z]|$)/.test(t))s.add('un');return[...s]};
function tileTap(t){if(t.classList.contains('used'))return;snd('tap');document.querySelectorAll('.tile.hint').forEach(x=>x.classList.remove('hint'));pulse(lay(t.dataset.t));if(selSlot)return place(t,selSlot);document.querySelectorAll('.tile.sel').forEach(x=>x.classList.remove('sel'));sel=t;t.classList.add('sel')}
function slotTap(s){if(s.classList.contains('ok'))return;snd('tap');if(s.dataset.txt){ret(s);return}if(sel)return place(sel,s);document.querySelectorAll('.slot.on2').forEach(x=>x.classList.remove('on2'));selSlot=s;s.classList.add('on2')}
function place(t,s){const ra=t.getBoundingClientRect(),rb=s.getBoundingClientRect(),c=document.createElement('div'),txt=t.dataset.t;c.className='tile';c.textContent=txt;c.style.cssText=`position:fixed;left:${ra.left}px;top:${ra.top}px;width:${ra.width}px;z-index:300;margin:0;direction:${dirOf(txt)}`;document.body.appendChild(c);
 t.classList.add('used');t.classList.remove('sel');sel=selSlot=null;s.classList.remove('on2');s.dataset.txt=txt;
 c.animate([{transform:'none'},{transform:`translate(${rb.left+rb.width/2-ra.left-ra.width/2}px,${rb.top+rb.height/2-ra.top-ra.height/2}px)`}],{duration:300,easing:'ease-out'}).onfinish=()=>{c.remove();s.textContent=txt;s.style.direction=dirOf(txt);snd('pop');pulse(lay(txt));cp();chk()}}
function ret(s){const t=tileOf(s.dataset.txt);t&&t.classList.remove('used');delete s.dataset.txt;s.textContent='';s.classList.remove('on2','bad');cp()}
/* الإنارة الدائمة: الجزء المقابل للقطعة المضغوطة يظهر ويبقى مضيئاً حتى تضغط قطعة أخرى لها جزء في الرسم */
function pulse(ids){const ok=ids.filter(i=>document.getElementById(i));if(!ok.length)return;document.querySelectorAll('#fc .bt.act').forEach(e=>e.classList.remove('act'));ok.forEach(i=>{const e=document.getElementById(i);e.classList.add('on','act')})}
/* مقارنة لا تعتمد على الترتيب: مفتاح قانوني لكل حدّ، ثم نفرز مفاتيح المجموعة (k) ونقارنها */
const canon=t=>{t=String(t).replace(/\s+/g,'');const m=t.match(/^(m\()?∠(\w)(\w)(\w)\)?$/);if(m)return(m[1]||'')+'∠'+m[3]+[m[2],m[4]].sort().join('');if(/^[A-Z]{2}$/.test(t))return t.split('').sort().join('');if(!/[−\-]/.test(t)&&t.includes('+'))return t.split('+').sort().join('+');return t};
function judge(r,sl){const cs=r.c.filter(c=>c.s!=null),res=sl.map(()=>false),G2={},kk=(ix,fn)=>ix.map(i=>canon(fn(i))).join('\u0001');cs.forEach((c,i)=>{const k=c.k||('#'+i);(G2[k]=G2[k]||[]).push(i)});
 for(const k in G2){const T={};G2[k].forEach(i=>{const t=cs[i].t||('#'+i);(T[t]=T[t]||[]).push(i)});const terms=Object.values(T),rem=terms.map(ix=>kk(ix,i=>cs[i].s)).sort(),got=terms.map(ix=>kk(ix,i=>sl[i].dataset.txt));
  if(rem.join('|')==got.slice().sort().join('|')){G2[k].forEach(i=>res[i]=true);continue}
  terms.forEach((ix,n)=>{const j=rem.indexOf(got[n]);if(j>=0){rem.splice(j,1);ix.forEach(i=>res[i]=true)}else ix.forEach(i=>{if(canon(sl[i].dataset.txt)==canon(cs[i].s))res[i]=true})})}
 return res}
function chk(){if(S.ck===S.cur)return;const r=S.d.rows[S.cur],sl=[...$('#r'+S.cur).querySelectorAll('.slot')];if(sl.some(s=>!s.dataset.txt||s.classList.contains('bad')))return;
 const ok=judge(r,sl);let bad=0;sl.forEach((s,k)=>{if(ok[k])s.classList.add('ok');else{bad++;s.classList.add('bad');setTimeout(()=>ret(s),650)}});
 if(bad){S.fails++;streak=0;snd('soft');const pn_=S.d.mc?0:Math.min(PEN,1-(S.pc[S.cur]||0));if(pn_>0){S.spent+=pn_;S.pc[S.cur]=(S.pc[S.cur]||0)+pn_}upd();$('#pm').innerHTML='ليس تماماً 🤔 (الصحيح بقي في مكانه)'+(pn_>0?`<br><b style="color:#dc2626">خُصم ${fmt(pn_)} من درجتك ⚠️</b>`:'')+`<br>🧠 <b>تذكّر دائماً:</b> ${r.h}`;if(S.fails>=3){S.fails=0;setTimeout(()=>giveHint(1),1000)}return}
 S.ck=S.cur;S.fails=0;streak++;const g=S.d.gr[S.cur],e=g*(S.sh?.5:1);S.live+=e;S.sh=0;S.pts[S.cur]=e;snd('lock');boom(8);const rw=$('#r'+S.cur);rw.classList.remove('cur');rw.classList.add('done');if(g)rw.insertAdjacentHTML('afterbegin',`<span class="gt">+${fmt(e)}</span>`);glow(r.g);upd();
 if(S.cur<S.d.rows.length-1){S.cur++;cp();setTimeout(()=>{const n=$('#r'+S.cur);n.classList.remove('lk');n.classList.add('cur');fill(S.cur);begin();$('#pm').textContent='أحسنت! الخطوة التالية 👇'},800)}else setTimeout(finish,700)}
function giveHint(auto){const r=S.d.rows[S.cur],ex=exOf(r),t=[...document.querySelectorAll('.tile:not(.used)')].find(x=>ex.includes(x.dataset.t));if(!auto){S.hints--;S.sh=1}S.used++;
 if(t){t.classList.add('hint');setTimeout(()=>t.classList.remove('hint'),3500);const ids=lay(t.dataset.t);pulse(ids.length?ids:(r.reg||[]))}
 if(r.hx){glow(r.hx);pulse(r.hx)}
 $('#pm').innerHTML=(auto?'🎁 تلميح مجاني: ':'💡 ')+r.h;upd();cp()}
function hintBtn(){if(S.hints>0){giveHint(0);return}
 $('#ov').innerHTML=`<div class="ov"><div class="card center"><div style="font-size:44px">💡</div><h2>تريد مساعدة أكثر؟</h2><p>بدّل <b>نقطة واحدة</b> بثلاثة تلميحات إضافية.<br>المساعدة لها ثمن صغير… والتعلّم يستحق!</p><button class="big" onclick="deal(1)">نعم، أبدّل نقطة</button><button class="big alt" onclick="deal(0)">لا، سأحاول بنفسي</button></div></div>`}
function deal(y){$('#ov').innerHTML='';if(y){S.spent++;S.hints=3;upd();$('#pm').textContent='تم! حصلت على 3 تلميحات 💡';cp()}}
function finish(){snd('win');boom(26);$('#fc').classList.add('shine');const u=$('#un text');if(u)u.textContent=S.d.ans;S.ph='paper';cp();
 $('#pm').outerHTML='';$('#pool').outerHTML=`<div class="ban">🎉 اكتمل البرهان!</div><button class="big" onclick="paper()">التحدّي الأخير ✍️</button>`;document.querySelector('.tools').remove()}
function paper(){$('#fc').classList.remove('shine','mini');pn(`<div class="card center"><div style="font-size:60px">✍️</div><h2>التحدّي الأخير</h2><p style="line-height:1.9;font-size:18px">الآن اكتب هذا البرهان على <b>ورقة حقيقية</b>.<br>لا تنظر! هل أنت جاهز؟</p><button class="big" onclick="endQ()">كتبته — أنا جاهز ✅</button><button class="big alt" onclick="again()">أرني مرة أخرى 👀</button></div>`)}
function again(){pn(`<div class="card pf"><h3>البرهان كاملاً (للقراءة فقط)</h3>${S.d.rows.map(r=>`<div class="row done" style="direction:${r.d}">${r.c.map(c=>fxH(c.s!=null?c.s:c.f)).join(' ')}</div>`).join('')}<button class="big" onclick="endQ()">كتبته — أنا جاهز ✅</button></div>`)}
function endQ(){const m=S.m,q=S.q,fin=Math.max(0,S.live-S.spent),old=U.best[m][q];U.best[m][q]=old==null?fin:Math.max(old,fin);S.ph='end';U.cp=null;sv();upd();snd(fin==4?'win':'ok');if(fin==4)boom(24);const last=RUN.k==RUN.qs.length-1;$('#fc').style.display='none';
 pn(`<div class="card center"><div style="font-size:50px">${fin==4?'🏅':'👏'}</div><h2>درجة هذا السؤال</h2><div class="score">${fmt(fin)} / 4</div>${old!=null&&old>fin?`<p>تُحتسب أفضل درجة لك: <b>${fmt(old)}</b></p>`:''}<button class="big" onclick="${last?'stageRes()':'RUN.k++;question()'}">${last?'🏁 نتيجة النموذج':'السؤال التالي ▶'}</button></div>`)}
function stageRes(){const m=RUN.m,s=msc(m),ok=pass(m),n=stars(s),miss=[0,1,2,3,4].filter(q=>bs_(m,q)<4);hd(0);ok?(snd('win'),rain()):snd('soft');
 const msg=ok?(s==20?'درجة كاملة! أنت بطل حقيقي 👑':'ممتاز! فتحت الخطوة التالية 🎉'):`قريب جداً! 💪 تحتاج <b>${fmt(16-s)}</b> درجات لتفتح التالي. كل محاولة تجعلك أقوى — الجهد يُحتسب دائماً.`;
 pn(`<div class="card center"><div style="font-size:50px">${ok?'🎉':'💪'}</div><h2>نتيجة النموذج (${MODN[m]})</h2><div class="stars">${'⭐'.repeat(n)}${'☆'.repeat(3-n)}</div><div class="score">${fmt(s)} / 20</div>
 ${[0,1,2,3,4].map(q=>`<div class="qr"><span>س${q+1}</span><span>${bs_(m,q)==4?'✅':'⚠️'} ${fmt(bs_(m,q))} / 4</span></div>`).join('')}<p style="line-height:1.8;font-weight:700">${msg}</p>
 ${ok?(allp()?'<button class="big" onclick="cert()">🏆 افتح شهادتك</button>':m<2?`<button class="big" onclick="open_(${m+1})">النموذج التالي ▶</button>`:''):''}
 ${miss.length?`<button class="big ${ok?'alt':''}" onclick="run(${m},[${miss}])">🎯 أعد الأسئلة الخاطئة فقط</button><button class="big alt" onclick="run(${m},[0,1,2,3,4])">🔁 أعد النموذج كاملاً</button>`:''}
 <button class="big alt" onclick="map()">🗺️ الخريطة</button></div>`)}
function cert(){hd(0);snd('win');rain();const t=[0,1,2].reduce((a,m)=>a+msc(m),0),miss=[0,1,2].find(m=>[0,1,2,3,4].some(q=>bs_(m,q)<4));
 pn(`<div class="card center cert"><div style="font-size:54px">🏆</div><h2>شهادة تفوّق</h2><p style="line-height:1.9">يشهد الأستاذ بأن البطل<br><b style="font-size:26px;color:#7c3aed">${esc(U.name)||'البطل المجهول'}</b><br>${U.cls?'فصل '+esc(U.cls):''}<br>أنهى جميع قضايا المتوازيات والقاطع</p>
 <div class="tbl">${[0,1,2].map(m=>`<div>نموذج ${MODN[m]}<br><b>${fmt(msc(m))}</b>/20</div>`).join('')}</div><div class="score">${fmt(t)} / 60</div>
 <h2>${t>=54?'👑 بطل الهندسة':t>=48?'🌟 نجم الهندسة':'🕵️ محقق المتوازيات'}</h2><p style="color:#92400e;font-weight:700">الأستاذ عبد الرحمن محمود عبد المنصف حمودة</p>
 ${miss!=null?`<button class="big" onclick="open_(${miss})">🎯 أعد الأسئلة الخاطئة</button>`:''}<button class="big alt" onclick="map()">🗺️ الخريطة</button></div>`)}
intro();
</script></body></html>
