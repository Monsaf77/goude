 pn(`<div class="card center"><div style="font-size:50px">${ok?'🎉':'💪'}</div><h2>${WLD[m].i} ${WLD[m].n} — نموذج (${MN[m]})</h2><div class="stars">${'⭐'.repeat(n)}${'☆'.repeat(3-n)}</div><div class="score">${fm(s)} / 20</div>${[0,1,2,3,4].map(q=>`<div class="qr"><span>س${q+1}</span><span>${B(m,q)==4?'✅':'⚠️'} ${fm(B(m,q)||0)} / 4</span></div>`).join('')}<p style="line-height:1.8;font-weight:700">${ok?(s==20?'درجة كاملة! أنت بطل حقيقي 👑':'ممتاز! فتحت الخطوة التالية 🎉'):`قريب جداً! 💪 تحتاج <b>${fm(16-s)}</b> درجات لتفتح التالي. الجهد يُحتسب دائماً.`}</p>
 ${ok?(allp()?'<button class="big" onclick="cert()">🏆 افتح شهادتك</button>':m<2?`<button class="big" onclick="open_(${m+1})">النموذج التالي ▶</button>`:''):''}${miss.length?`<button class="big ${ok?'alt':''}" onclick="run(${m},[${miss}])">🎯 أعد الأسئلة الناقصة فقط</button>`:''}<button class="big alt" onclick="run(${m},[0,1,2,3,4])">🔁 أعد النموذج كاملاً</button><button class="big alt" onclick="map()">🗺️ الخريطة</button></div>`)}
function cert(){hdr(0);snd('win');boom(30);const t=[0,1,2].reduce((a,m)=>a+ms(m),0),mi=[0,1,2].find(m=>[0,1,2,3,4].some(q=>(B(m,q)||0)<4));pn(`<div class="card center cert"><div style="font-size:54px">🏆</div><h2>شهادة تفوّق</h2><p style="line-height:1.9">يشهد الأستاذ بأن البطل<br><b style="font-size:26px;color:#8b5cf6">${(U.name||'البطل المجهول').replace(/</g,'')}</b><br>${U.cls?'فصل '+U.cls.replace(/</g,''):''}<br>أنهى جميع قضايا تطابق المضلعات والمثلثات</p><div class="score">${fm(t)} / 60</div><p style="font-weight:800">الرتبة: ${RK[ri(xp())][1]} ${RK[ri(xp())][2]} · ${xp()} XP</p><h2>${t>=54?'👑 بطل الهندسة':t>=48?'🌟 نجم الهندسة':'🕵️ محقق التطابق'}</h2><p style="color:#b45309;font-weight:700">الأستاذ عبد الرحمن محمود عبد المنصف حمودة</p>${mi!=null?`<button class="big" onclick="open_(${mi})">🎯 أعد الأسئلة الناقصة</button>`:''}<button class="big alt" onclick="map()">🗺️ الخريطة</button></div>`)}
intro();
</script></body></html>
